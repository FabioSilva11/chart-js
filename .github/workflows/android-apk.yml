name: Build APK Comanda

on:
  push:
    paths: ['comanda-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comanda-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: gradle assembleDebug --console=plain
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComandaMurupi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComandaMurupi-apk
          path: comanda-app/ComandaMurupi.apk
      - name: Publicar em Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Comanda Murupi (última versão)
          prerelease: true
          files: comanda-app/ComandaMurupi.apk
